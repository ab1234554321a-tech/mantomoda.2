# =============================================================================
#  Manto Moda — API contract (OpenAPI 3.1)
#
#  This file is checked against the running code by scripts/api-contract-check.mjs
#  (`npm run api:check`, also a CI step): a route that exists in the app but not
#  here — or here but not in the app — fails the build. The contract is only
#  worth having if it is true (see ADR-023 on documentation drift).
# =============================================================================
openapi: 3.1.0
info:
  title: Manto Moda API
  version: 0.4.0-rc1
  description: |
    Persian RTL storefront and back office for a manto/coat retailer.

    **Authentication** — every response that carries a user or an order is scoped to the
    bearer token; roles are `REGULAR`, `WHOLESALE` and `ADMIN`. Orders and invoices are
    ownership-checked (a customer reading another customer's order gets 403, never 404-by-luck).

    **Prices** — wholesale prices are stripped server-side for anyone who is not a verified
    wholesale partner (ADR-003), and every charged amount is recomputed on the server at
    checkout; a client-supplied price is discarded.

    **Money** — amounts are integer Toman, never floats.

    **Demo mode** — `POST /api/auth/switch-role` mints a token for a requested role with no
    password and exists for demonstrations. On a live shop it answers 404 (ADR-024);
    `GET /api/config` tells a client which kind of deployment it is talking to.

    **Rate limits** — `/api/auth` is limited per IP (30 requests / 15 minutes in production),
    the rest of the API 300/minute. 429 responses carry a Persian message.
  license:
    name: Proprietary
servers:
  - url: https://shop.example.ir
    description: production (replace with the real domain)
  - url: http://localhost:3000
    description: local development
tags:
  - name: Meta
    description: Health, runtime configuration and SEO endpoints
  - name: Auth
    description: Sessions, registration and mobile verification
  - name: Catalog
    description: Public product catalogue
  - name: Wholesale
    description: Wholesale applications
  - name: Cart
    description: Server-side pricing
  - name: Orders
    description: Checkout and order history
  - name: Invoices
    description: Invoices (JSON + signed printable link)
  - name: Payments
    description: Iranian IPG adapter flow
  - name: Admin
    description: Back office (admin role required)
  - name: Demo
    description: Demonstration-only endpoints (absent in production)

security:
  - {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HMAC-SHA256 JWT issued by /api/auth/login or /api/auth/register.
  schemas:
    Error:
      type: object
      description: "Every failure answers in this shape: a machine code plus a Persian message."
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
      example:
        success: "false"
        error: "INVALID_CREDENTIALS"
        message: "اطلاعات ورود نادرست است."
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
      example:
        identifier: "neda.alavi@gmail.com"
        password: "…"
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
      example:
        fullName: "ندا علوی"
        email: "a@b.ir"
        phone: "09120000000"
        password: "…"
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
      example:
        phone: "09120000000"
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
      example:
        phone: "09120000000"
        code: "123456"
    SwitchRoleRequest:
      type: object
      description: Demo only.
      properties:
        targetRole:
          type: string
          description: GUEST, REGULAR, PENDING, WHOLESALE, ADMIN
      example:
        targetRole: "ADMIN"
    User:
      type: object
      description: A user as the API exposes it — never includes the password hash.
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
        isWholesaleVerified:
          type: boolean
        companyName:
          type: string
      example:
        id: "usr-1"
        email: "a@b.ir"
        role: "REGULAR"
    Variant:
      type: object
      properties:
        id:
          type: string
        color:
          type: string
        size:
          type: string
        stock:
          type: integer
      example:
        id: "var-1"
        color: "مشکی"
        size: "38"
        stock: 12
    Product:
      type: object
      description: Wholesale fields are present only for verified wholesale partners and admins.
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        sku:
          type: string
        category:
          type: string
        material:
          type: string
        season:
          type: string
        description:
          type: string
        retailPrice:
          type: integer
        wholesalePrice:
          type: integer
        wholesaleMinQuantity:
          type: integer
        images:
          type: array
          items: {}
        variants:
          type: array
          items: {}
        isArchived:
          type: boolean
      example:
        id: "prod-001"
        title: "مانتو ترنچ"
        sku: "MM-MANTO-TRENCH"
        retailPrice: 1850000
        variants: [{'id': 'var-1', 'stock': 12}]
    CartCalculateRequest:
      type: object
      description: The cart is re-priced server-side; any price sent by the client is ignored.
      properties:
        items:
          type: array
          items: {}
        couponCode:
          type: string
        province:
          type: string
      example:
        items: [{'productId': 'prod-001', 'variantId': 'var-1', 'quantity': 2}]
        couponCode: "WELCOME10"
    ShippingAddress:
      type: object
      properties:
        recipientName:
          type: string
        phone:
          type: string
          description: Iranian mobile
        province:
          type: string
        city:
          type: string
        fullAddress:
          type: string
        postalCode:
          type: string
      example:
        recipientName: "سارا رضایی"
        phone: "09121112233"
        province: "تهران"
        city: "تهران"
        fullAddress: "خیابان ولیعصر پلاک ۱"
    OrderCreateRequest:
      type: object
      properties:
        items:
          type: array
          items: {}
        shippingAddress:
          type: ShippingAddress
        paymentMethod:
          type: ONLINE_GATEWAY | BANK_TRANSFER_RECEIPT
        couponCode:
          type: string
      example:
        items: [{'productId': 'prod-001', 'variantId': 'var-1', 'quantity': 1}]
        paymentMethod: "ONLINE_GATEWAY"
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        variantId:
          type: string
        productTitle:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
        totalPrice:
          type: integer
    Order:
      type: object
      description: Totals are stored at checkout time and re-read for invoices, so a later price change never rewrites history (ADR-018).
      properties:
        id:
          type: string
        orderNumber:
          type: string
          description: MM-ORD-YYYY-NNNNN, monotonic
        status:
          type: string
          description: PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED
        paymentStatus:
          type: string
        orderType:
          type: string
          description: RETAIL, WHOLESALE
        items:
          type: array
          items: {}
        subtotal:
          type: integer
        discount:
          type: integer
        shipping:
          type: integer
        payableAmount:
          type: integer
        couponCode:
          type: string
        shippingAddress:
          type: ShippingAddress
        createdAt:
          type: string
          description: date-time
      example:
        orderNumber: "MM-ORD-2026-00123"
        status: "CONFIRMED"
        payableAmount: 1850000
    OrderStatusUpdate:
      type: object
      description: Only legal state-machine transitions are accepted (ADR-011).
      properties:
        status:
          type: string
      example:
        status: "SHIPPED"
    CouponInput:
      type: object
      properties:
        code:
          type: string
        type:
          type: PERCENT | FIXED
        value:
          type: integer
        minBasket:
          type: integer
        maxDiscount:
          type: integer
        usageLimit:
          type: integer
        perUserLimit:
          type: integer
        expiresAt:
          type: string
          description: date-time
        appliesTo:
          type: ALL | RETAIL | WHOLESALE
      example:
        code: "WELCOME10"
        type: "PERCENT"
        value: 10
    ShopSettings:
      type: object
      description: Editable from the panel so a shipping price is a business decision, not a deploy (ADR-017).
      properties:
        shipping:
          type: object
        inventory:
          type: object
        shop:
          type: object
      example:
        shipping: {'flatFee': 45000, 'freeShippingThreshold': 2000000}
    InventoryBulk:
      type: object
      properties:
        updates:
          type: array
          items: {}
        threshold:
          type: integer
      example:
        updates: [{'productId': 'prod-001', 'variantId': 'var-1', 'stock': 8}]
    WholesaleApplicationRequest:
      type: object
      properties:
        companyName:
          type: string
        economicCode:
          type: string
        province:
          type: string
        city:
          type: string
        businessPhone:
          type: string
        storeType:
          type: PHYSICAL_STORE | ONLINE_SHOP | BOTH
        businessAddress:
          type: string
    WholesaleReview:
      type: object
      properties:
        status:
          type: APPROVED | REJECTED
        adminNotes:
          type: string
      example:
        status: "APPROVED"
    PaymentRequest:
      type: object
      properties:
        orderId:
          type: string
      example:
        orderId: "ord-1"
    PaymentVerifyRequest:
      type: object
      description: Server-to-server verification; idempotent per order.
      properties:
        orderId:
          type: string
        authority:
          type: string
      example:
        orderId: "ord-1"
    Invoice:
      type: object
      description: Printable page is served from the signed link; this JSON is for the owner/accountant.
      properties:
        orderNumber:
          type: string
        shop:
          type: object
        customer:
          type: object
        lines:
          type: array
          items: {}
        totals:
          type: object
        paymentStatus:
          type: string
    RuntimeConfig:
      type: object
      properties:
        version:
          type: string
        environment:
          type: string
        demoMode:
          type: boolean
        demoData:
          type: boolean
      example:
        version: "0.4.0-rc1"
        environment: "production"
        demoMode: false
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        environment:
          type: string
        uptimeSeconds:
          type: integer
        memory:
          type: object
        persistence:
          type: object
        demoMode:
          type: boolean
      example:
        status: "healthy"
        version: "0.4.0-rc1"

    # --- Response envelopes -------------------------------------------------
    # Every successful response is wrapped in { success: true, data: … }; these
    # schemas describe the wrapper, and the field-level shapes above are reused
    # inside `data`. Keeping one envelope keeps client error handling trivial.
    ApiMessage:
      type: object
      description: "Success envelope with a human-readable Persian message."
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
      example: { success: true, message: "انجام شد." }
    AuthSession:
      type: object
      description: "A signed-in session: the JWT plus the user it belongs to."
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
              description: "HMAC-SHA256 JWT, valid 7 days by default (JWT_EXPIRES_IN)."
            user:
              $ref: '#/components/schemas/User'
      example: { success: true, data: { token: "eyJhbGciOi…", user: { role: "REGULAR" } } }
    OtpPolicy:
      type: object
      description: "What the OTP service enforces, so the UI does not have to guess."
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            length: { type: integer }
            ttlSeconds: { type: integer }
            maxAttempts: { type: integer }
            resendAfterSeconds: { type: integer }
            provider: { type: string }
    ProductList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          type: object
          description: "Pagination envelope (page, limit, total, totalPages, hasMore)."
    CategoryList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              count: { type: integer }
    CartSummary:
      type: object
      description: "Prices recomputed on the server. `notices` explains business rules (bulk thresholds, stock)."
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            subtotal: { type: integer }
            discount: { type: integer }
            shipping: { type: integer }
            payable: { type: integer }
            couponCode: { type: string }
            notices:
              type: array
              items: { type: string }
    OrderList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          type: object
          description: "Pagination envelope for back-office lists."
    InvoiceLink:
      type: object
      description: "A signed, expiring URL anyone holding it can open — no login, no listing (ADR-018)."
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            url: { type: string }
            expiresAt: { type: string }
    WholesaleApplication:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            id: { type: string }
            companyName: { type: string }
            city: { type: string }
            businessPhone: { type: string }
            businessAddress: { type: string }
            economicCode: { type: string }
            status: { type: string, description: "PENDING | APPROVED | REJECTED" }
            adminNotes: { type: string }
            createdAt: { type: string }
    WholesaleApplicationList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: '#/components/schemas/WholesaleApplication'
    AdminStats:
      type: object
      description: "Recognised revenue counts paid/confirmed orders only; cancellations are excluded."
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            revenueToday: { type: integer }
            revenueThisMonth: { type: integer }
            revenueAllTime: { type: integer }
            averageOrderValue: { type: integer }
            ordersToday: { type: integer }
            ordersThisMonth: { type: integer }
            billableOrders: { type: integer }
            cancelledOrders: { type: integer }
            pendingOrdersCount: { type: integer }
            awaitingPayment: { type: integer }
            topProducts:
              type: array
              items: { type: object }
            lowStock:
              type: array
              items: { type: object }
    CouponList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              type: { type: string }
              value: { type: integer }
              usageCount: { type: integer }
              isActive: { type: boolean }
              expiresAt: { type: string }
    LowStockList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              productTitle: { type: string }
              variantId: { type: string }
              color: { type: string }
              size: { type: string }
              stock: { type: integer }
              threshold: { type: integer }
    AuditLogList:
      type: object
      description: "Every successful admin write, with secrets redacted (ADR-020)."
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              actorEmail: { type: string }
              action: { type: string }
              target: { type: string }
              ip: { type: string }
              createdAt: { type: string }
    PaymentInit:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            redirectUrl: { type: string, description: "Where to send the customer's browser." }
            authority: { type: string }
    PaymentStatus:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            orderId: { type: string }
            paymentStatus: { type: string }
            refId: { type: string }
            paidAt: { type: string }

    ProductInput:
      type: object
      description: "Product payload for create/update. Validation is server-side and refuses the easy mistakes: negative or non-integer prices, a missing variant, a duplicate colour+size, a wholesale price that is not below retail."
      required: [title, category, retailPrice, variants]
      properties:
        title: { type: string, description: "Displayed name (Persian or English)." }
        category: { type: string }
        material: { type: string }
        season: { type: string }
        description: { type: string }
        retailPrice: { type: integer, description: "Toman, non-negative integer." }
        wholesalePrice: { type: integer, description: "Toman, must be below retailPrice." }
        wholesaleMinQuantity: { type: integer }
        sku: { type: string, description: "Latin-only warehouse code; generated from the title when omitted." }
        isFeatured: { type: boolean }
        variants:
          type: array
          items:
            type: object
            properties:
              color: { type: string }
              size: { type: string }
              stock: { type: integer }
              colorHex: { type: string }
      example:
        title: "مانتو کتی اداری"
        category: "مانتو کتی و اداری"
        retailPrice: 1850000
        wholesalePrice: 1295000
        variants: [{ color: "مشکی", size: "38", stock: 12 }]

    # Wrapper used by endpoints whose payload is a documented set of fields above
    # (kept explicit rather than loosening the whole contract to `object`).
    AdminSettings:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/ShopSettings'
    ProductEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/Product'
    CouponEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
    OrderEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/Order'
    MessageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: object }

paths:
  /api/config:
    get:
      tags: [Meta]
      summary: "Public runtime configuration: version, environment, demoMode, demoData — the client uses this to hide demo-only UI on a live shop (ADR-024)"
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
  /api/health:
    get:
      tags: [Meta]
      summary: "Liveness/readiness: version (from package.json), uptime, memory, persistence state"
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /robots.txt:
    get:
      tags: [Meta]
      summary: robots.txt
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /sitemap.xml:
    get:
      tags: [Meta]
      summary: sitemap.xml with canonical product URLs
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /page/{slug}:
    get:
      tags: [Meta]
      summary: "Editorial page: terms, returns, privacy, sizing or contact (ADR-025). Server-rendered HTML so it reads without JavaScript and carries its own metadata. The contact page prints the shop identity from settings — the same values as the invoice."
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [terms, returns, privacy, sizing, contact]
      security: []
      responses:
        '200':
          description: The rendered page
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No such page
          content:
            text/html:
              schema:
                type: string
  /product/{slug}:
    get:
      tags: [Meta]
      summary: "Pre-rendered product page: real title/description/OpenGraph/JSON-LD for crawlers and link previews (ADR-015)"
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with e-mail/phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Authentication required or token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create a retail customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: Conflict (duplicate, insufficient stock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a one-time SMS code to a mobile number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpPolicy'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify a one-time code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/otp/policy:
    get:
      tags: [Auth]
      summary: OTP policy (length, TTL, attempt limits) so the UI matches the server
      security: []
      responses:
        '200':
          description: Success
