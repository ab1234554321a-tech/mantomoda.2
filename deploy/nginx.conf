# =============================================================================
#  Manto Moda — Nginx reverse proxy (HTTPS termination + upload limits)
#
#  Install:
#    1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/mantomoda
#    2. Replace YOUR_DOMAIN below with the real domain.
#    3. sudo ln -s /etc/nginx/sites-available/mantomoda /etc/nginx/sites-enabled/
#    4. sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN   (free HTTPS)
#    5. sudo nginx -t && sudo systemctl reload nginx
#
#  Why Nginx in front of Node:
#   * HTTPS with automatic renewal (Zarinpal callback URLs must be https in production).
#   * The upload limit lives here too — 6 MB, slightly above the app's own 5 MB,
#     so an oversized photo gets a clear 413 from the app rather than a hang.
#   * Static assets and uploaded images are served straight from disk/cache.
# =============================================================================

# --- Redirect HTTP to HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let certbot validate without a redirect loop.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main shop ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot fills these in automatically.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers that are not the app's job (the app sets CSP, nosniff, etc.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6M;      # product photo uploads
    client_body_timeout 30s;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploaded product images never change once written: cache them hard.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app builds payment callbacks and canonical URLs from this header.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Health endpoint for uptime monitors — no need to expose it publicly otherwise.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }
}
